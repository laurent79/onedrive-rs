[package]
name = "odrs-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "parsing", "formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "io-util", "macros", "fs", "sync"] }
tracing = "0.1.44"
url = "2.5.8"
odrs-quickxor = { version = "0.1.0", path = "../quickxor" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
