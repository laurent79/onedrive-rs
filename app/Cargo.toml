[package]
name = "onedrive-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
odrs-engine = { version = "0.1.0", path = "../crates/engine" }
odrs-graph = { version = "0.1.0", path = "../crates/graph" }
odrs-store = { version = "0.1.0", path = "../crates/store" }
odrs-quickxor = { version = "0.1.0", path = "../crates/quickxor" }
odrs-ipc = { version = "0.1.0", path = "../crates/ipc" }
odrs-gui = { version = "0.1.0", path = "../crates/gui" }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
